<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1017;--ink:#f4f1ea;--muted:#9aa6b2;--gold:#f2c75c;--teal:#3fa89a;--teal-dim:#24423f}
body{width:1200px;height:675px;background:var(--bg);overflow:hidden;font-family:Manrope,'DejaVu Sans',sans-serif;color:var(--ink);position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--teal-dim) 1px,transparent 1px),linear-gradient(90deg,var(--teal-dim) 1px,transparent 1px);background-size:40px 40px;opacity:.25;mask-image:linear-gradient(90deg,transparent 0%,#000 55%)}
canvas{position:absolute;right:-30px;top:20px}
.glow{position:absolute;width:520px;height:520px;right:40px;top:80px;border-radius:50%;background:radial-gradient(circle,rgba(242,199,92,.18),transparent 65%)}
.content{position:absolute;left:72px;top:58px;width:640px}
.tag{display:inline-block;font:700 18px Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--gold);padding:8px 16px;border-radius:999px}
h1{font:800 60px/1.05 Unbounded,'DejaVu Sans',sans-serif;margin-top:28px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--gold)}
p{font-size:24px;line-height:1.45;color:var(--muted);margin-top:24px;max-width:540px}
.chips{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.chip{font:700 18px Manrope,sans-serif;color:var(--teal);border:2px solid var(--teal);padding:8px 16px;border-radius:12px}
.cta{position:absolute;left:72px;bottom:48px;display:flex;align-items:center;gap:18px;font:700 22px Manrope,sans-serif}
.cta b{background:var(--gold);color:var(--bg);padding:14px 26px;border-radius:14px;font:600 22px Unbounded,sans-serif}
.cta span{color:var(--muted)}
.formula{position:absolute;font:600 22px Unbounded,sans-serif;color:var(--gold);opacity:.85}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<canvas id="c" width="620" height="620"></canvas>
<div class="formula" style="right:48px;bottom:26px">e<sup>iπ</sup> + 1 = 0</div>
<div class="formula" style="right:48px;top:40px;color:var(--teal)">φ = 1.618…</div>
<div class="content">
  <div class="tag">Для студентов</div>
  <h1>Математика,<br>которая <em>цепляет</em></h1>
  <p>Каждый день новая идея: фракталы, парадоксы, теоремы. Коротко и&nbsp;наглядно.</p>
  <div class="chips"><div class="chip">∞ Фракталы</div><div class="chip">∑ Теория чисел</div><div class="chip">P(A) Вероятность</div></div>
</div>
<div class="cta"><b>Подписывайся →</b><span>утром и вечером</span></div>
<script>
// кривая дракона
const c=document.getElementById('c'),x=c.getContext('2d');
let s=[1];for(let i=0;i<12;i++){s=s.concat([1],s.slice().reverse().map(v=>1-v))}
let px=0,py=0,d=0,pts=[[0,0]];const dx=[1,0,-1,0],dy=[0,1,0,-1];
pts.push([px+=dx[d],py+=dy[d]]);for(const t of s){d=(d+(t?1:3))%4;pts.push([px+=dx[d],py+=dy[d]])}
const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
const k=540/Math.max(mxx-mnx,mxy-mny),ox=(620-(mxx-mnx)*k)/2,oy=(620-(mxy-mny)*k)/2;
x.lineWidth=1.6;x.lineCap='round';
for(let i=1;i<pts.length;i++){const t=i/pts.length;
 x.strokeStyle=`hsl(${170-t*125},${55+t*30}%,${50+t*12}%)`;
 x.beginPath();x.moveTo(ox+(pts[i-1][0]-mnx)*k,oy+(pts[i-1][1]-mny)*k);x.lineTo(ox+(pts[i][0]-mnx)*k,oy+(pts[i][1]-mny)*k);x.stroke()}
</script></body></html>
